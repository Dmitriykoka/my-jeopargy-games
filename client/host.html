<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ведущий — Совя игра</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/app.css" />
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
</head>
<body>
  <div class="wrap" id="app">
    <div class="topbar">
      <h1 class="brand">Совя игра</h1>
      <div class="actions">
        <a class="muted" href="/admin" style="align-self:center">Админ</a>
        <button type="button" class="secondary" id="btn-settings">Настройки</button>
        <button type="button" class="bad" id="btn-reset">Сброс</button>
      </div>
    </div>

    <div class="grid-2">
      <div class="panel">
        <h2 style="margin-top:0">Игроки</h2>
        <ul class="players" id="players"></ul>
        <p class="muted" id="control-hint"></p>
      </div>
      <div class="panel" style="text-align:center">
        <h2 style="margin-top:0">QR для входа</h2>
        <canvas id="qr" width="180" height="180"></canvas>
        <p class="muted" id="join-url" style="word-break:break-all;font-size:0.85rem"></p>
      </div>
    </div>

    <div class="panel" style="margin-top:1rem" id="lobby-panel">
      <h2 style="margin-top:0">Старт партии</h2>
      <div class="admin-form" style="max-width:480px">
        <label>
          Пакет вопросов
          <select id="pack-select"></select>
        </label>
        <label>
          Время на ответ (сек)
          <input type="number" id="answer-time" min="5" max="120" value="20" />
        </label>
        <label>
          Время на buzz (сек)
          <input type="number" id="buzz-time" min="5" max="120" value="30" />
        </label>
        <button type="button" id="btn-start">Начать игру</button>
      </div>
    </div>

    <div id="board-root"></div>
  </div>

  <div class="overlay" id="question-overlay" hidden>
    <div class="overlay-card">
      <div>
        <p class="muted" id="ov-meta"></p>
        <h2 class="q-text" id="ov-question"></h2>
        <div class="media-box" id="ov-media"></div>
      </div>
      <div>
        <div id="ov-status" style="text-align:center;margin-bottom:0.8rem"></div>
        <div class="actions" id="ov-actions"></div>
        <p class="muted" style="text-align:center" id="ov-answer-wrap" hidden>
          Ответ: <strong id="ov-answer"></strong>
          <button type="button" class="ghost" id="btn-toggle-answer" style="margin-left:0.5rem">Показать</button>
        </p>
      </div>
    </div>
  </div>

  <div class="overlay" id="settings-modal" hidden>
    <div class="overlay-card" style="min-height:auto;width:min(480px,96vw)">
      <h2 style="margin:0">Настройки</h2>
      <label>Время на ответ
        <input type="number" id="set-answer" min="5" max="120" />
      </label>
      <label>Время на buzz
        <input type="number" id="set-buzz" min="5" max="120" />
      </label>
      <div class="actions">
        <button type="button" class="secondary" id="btn-close-settings">Закрыть</button>
        <button type="button" id="btn-save-settings">Сохранить</button>
      </div>
    </div>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/host.js"></script>
</body>
</html>
