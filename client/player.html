<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Игрок — Совя игра</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/app.css" />
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>
  <div id="login" class="landing">
    <div class="landing-card">
      <h1>Совя игра</h1>
      <p class="muted">Введите имя для входа</p>
      <form id="login-form" class="admin-form" style="margin-top:1rem;text-align:left">
        <label>
          Имя
          <input id="name" maxlength="24" required placeholder="Например, Аня" autocomplete="nickname" />
        </label>
        <button type="submit">Подключиться</button>
      </form>
      <p id="login-error" class="muted" style="color:#ff8f8f"></p>
    </div>
  </div>

  <div id="game" class="player-shell" hidden>
    <div class="player-head">
      <strong id="pname"></strong>
      <span class="muted" id="pscore">0</span>
    </div>
    <button type="button" class="buzz wait" id="buzz" disabled>Ожидание…</button>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/player.js"></script>
</body>
</html>
